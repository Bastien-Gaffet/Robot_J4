name: Upload Python Package connect4_robot_j4 to PyPI

on:
  push:
    tags:
      - "v*" # Déclenche sur les tags (ex: v1.0.3)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # ✅ Requis pour OIDC (Trusted Publishing)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: pip install build

      - name: Build the package
        run: python -m build python/j4_connect4

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/j4_connect4/dist
          attestations: true
